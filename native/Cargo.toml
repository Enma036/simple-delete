[package]
name = "simple-delete"
version = "0.4.2"
edition = "2024"
description = "Native Windows application manager"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
winreg = "0.56.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_WindowsProgramming", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
